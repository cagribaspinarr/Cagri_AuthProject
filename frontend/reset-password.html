<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şifre Sıfırlama</title>
</head>
<body>
  <h2>Şifre Sıfırla</h2>
  <form id="resetPasswordForm">
    <input type="email" id="email" placeholder="Kayıtlı E-posta Adresiniz" required><br><br>
    <input type="password" id="newPassword" placeholder="Yeni Şifre (En az 6 karakter)" minlength="6" required><br><br>
    <input type="password" id="confirmPassword" placeholder="Yeni Şifre (Tekrar)" minlength="6" required><br><br>
    <button type="submit">Şifreyi Sıfırla</button>
  </form>
  <p><a href="login.html">Giriş Ekranına Dön</a></p>
</body>
</html>
