<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kullanıcı Kayıt</title>
</head>
<body>
  <h2>Kayıt Ol</h2>
  <form id="registerForm">
    <input type="text" id="username" placeholder="Kullanıcı Adı" required><br><br>
    <input type="email" id="email" placeholder="E-posta" required><br><br>
    <input type="password" id="password" placeholder="Şifre (En az 6 karakter)" minlength="6" required><br><br>
    <button type="submit">Kayıt Ol</button>
  </form>
</body>
</html>
